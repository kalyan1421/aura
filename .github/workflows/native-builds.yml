# Slow platform builds, kept out of per-push CI (macOS runners bill at 10× Linux minutes on private repos).
# Weekly on main, or by hand (Actions → Native builds → Run workflow) after touching ios/, android/, native plugins
# or the Flutter version, and before a TestFlight / Play upload. docs/setup/ci-and-deploy.md.
name: Native builds

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 0' # Sundays 21:30 UTC = Mondays 03:00 IST

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2 # keep in step with ci.yml
  JAVA_VERSION: '17' # android/app/build.gradle.kts compiles for Java 17
  DO_NOT_TRACK: '1'

defaults:
  run:
    shell: bash

jobs:
  android-debug:
    name: Android · debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter and Dart analytics off
        run: |
          flutter config --no-analytics --no-cli-animations
          dart --disable-analytics
      - run: dart pub get --enforce-lockfile
      - name: flutter build apk --debug
        working-directory: apps/mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aura-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios-simulator:
    name: iOS · simulator build (no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter and Dart analytics off
        run: |
          flutter config --no-analytics --no-cli-animations
          dart --disable-analytics
          xcodebuild -version
      - run: dart pub get --enforce-lockfile
      - name: flutter build ios --simulator --debug --no-codesign
        working-directory: apps/mobile
        run: flutter build ios --simulator --debug --no-codesign

  macos-tests:
    # The full suite (goldens included) on the platform the goldens were rendered on; per-push CI runs it on Linux
    # minus the goldens.
    name: Mobile · full test suite (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter and Dart analytics off
        run: |
          flutter config --no-analytics --no-cli-animations
          dart --disable-analytics
      - run: dart pub get --enforce-lockfile
      - name: flutter test
        working-directory: apps/mobile
        run: flutter test
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures
          path: apps/mobile/test/**/failures/
          retention-days: 7
          if-no-files-found: ignore
