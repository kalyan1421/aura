# Root of the Aura Dart pub workspace (Dart 3.6+ native workspaces, melos 7).
# The NestJS API (server/aura-api) is a Node package and is NOT part of this workspace.
name: aura_workspace
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/aura_domain
  - apps/mobile

dev_dependencies:
  melos: ^7.4.0

melos:
  name: aura
  scripts:
    analyze:
      run: melos exec -- dart analyze .
    test:
      run: melos exec --dir-exists=test -- flutter test
    gen:
      run: melos exec --depends-on=build_runner -- dart run build_runner build -d

# Build hooks are only read from the workspace root. Selects SQLite3MultipleCiphers so the app's
# Drift database is actually encrypted with its Keychain/Keystore key (apps/mobile README).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
