     viewBox="0 0 512 512"
     fill="none"
     role="img"
     aria-labelledby="title description">
  <title id="title">Aura Equal Orbit monochrome mark</title>
  <desc id="description">Four equal light orbital arcs surround one light circle.</desc>
  <defs>
    <path id="orbit-segment"
          d="M 108.279 229.953 A 150 150 0 0 1 229.953 108.279" />
  </defs>
  <g fill="none" stroke="#F2F0FF" stroke-width="50" stroke-linecap="round">
    <use href="#orbit-segment" />
    <use href="#orbit-segment" transform="rotate(90 256 256)" />
    <use href="#orbit-segment" transform="rotate(180 256 256)" />
    <use href="#orbit-segment" transform="rotate(270 256 256)" />
  </g>
  <circle cx="256" cy="256" r="54" fill="#F2F0FF" />
</svg>
