# Recommended Flutter lints plus the strict analyzer modes used across AK's
# workspaces (RMS). Generated code is excluded.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - prefer_const_constructors
    - use_super_parameters
