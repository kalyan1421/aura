name: aura
description: >-
  Aura mobile app (iOS + Android, com.akvega.aura). A calm, pseudonymous mood
  check-in app. Offline-first: every personal write lands in the encrypted
  local Drift store + outbox first, then syncs to NestJS (POST /v1/sync/push).
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared pure-Dart domain (catalogue, rules, AuraAvatarState).
  aura_domain:
    path: ../../packages/aura_domain

  # State, routing, models.
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local store: Drift over SQLite3MultipleCiphers (encrypted; see hooks below).
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.6.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0

  # Network.
  supabase_flutter: ^2.17.2
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # Utilities.
  uuid: ^4.6.0
  cryptography: ^2.9.0
  intl: ^0.20.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Voice notes (F1): capture (AAC/m4a) and playback of local files.
  record: ^7.1.1
  audioplayers: ^6.8.1

  # Sanctuary › Sounds (F15, Milestone B): one just_audio player per layer,
  # audio_session for focus, calls and headphone changes, audio_service for
  # the lock-screen / notification controls and the Android media-playback
  # foreground service (PRD 15-permissions "Background audio").
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_service: ^0.18.19

  # Time capsules (F4): photos from the system picker (PHPicker / Android
  # Photo Picker, no library permission), resized to ≤ 2,048 px with EXIF/GPS
  # stripped on device (package:image), and the offline date-unlock local
  # notification at 10:00 local.
  image_picker: ^1.2.3
  image: ^4.10.1
  flutter_local_notifications: ^22.3.1

  # Social sign-in (F8 REQ-ACC-01): native ID tokens exchanged with Supabase
  # (signInWithIdToken). docs/setup/social-sign-in.md.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

  # Product analytics (PRD 13-analytics, PostHog Cloud) and crash reporting
  # (Sentry), both behind lib/src/core/analytics/ and off unless the build
  # passes AURA_POSTHOG_KEY / AURA_SENTRY_DSN. docs/setup/analytics.md.
  posthog_flutter: ^5.46.0
  sentry_flutter: ^9.30.1

  # F12 Monetization: App Store (StoreKit 2) and Google Play Billing (PBL 8,
  # bundled by in_app_purchase_android >= 0.5.0) purchases, validated by
  # NestJS (DS-9; no RevenueCat). The platform packages are used directly for
  # StoreKit 2 intro-offer eligibility and Play subscription offer tokens.
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.13

  # F13 share cards: the OS share sheet only (its own "Save image" covers
  # saving, so no photo-library permission; PRD 15-permissions). No social
  # SDKs. The PNG is rendered on device (features/share).
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9

# Encrypted SQLite for Drift. package:sqlite3 (3.x) bundles SQLite through
# build hooks; `sqlite3mc` selects the SQLite3MultipleCiphers build (drift's
# recommended encryption setup; sqlcipher_flutter_libs is end-of-life).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: true

  shaders:
    - shaders/aura_glow.frag
    - shaders/aura_nebula.frag

  assets:
    - assets/avatar/aura_base.webp
    - assets/avatar/aura_base.png
    - assets/avatar/manifest.json

  fonts:
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
